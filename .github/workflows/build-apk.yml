name: Build & Release Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract App Version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Restore Keystore for Consistent APK Signatures
        env:
          KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "Restoring keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            echo "$KEYSTORE_SECRET" | base64 --decode > ~/.android/debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring keystore from repository file debug.keystore.base64..."
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore
          else
            echo "::warning ::No persistent keystore found. Gradle will generate a default debug keystore."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Versioned APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tinta-Trama-v${{ env.APP_VERSION }}.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tinta-Trama-v${{ env.APP_VERSION }}
          path: app/build/outputs/apk/debug/Tinta-Trama-v${{ env.APP_VERSION }}.apk

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: "Tinta & Trama v${{ env.APP_VERSION }} (Build ${{ github.run_number }})"
          files: app/build/outputs/apk/debug/Tinta-Trama-v${{ env.APP_VERSION }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
